name: Journaux des fonctions (lecture)

# Affiche les journaux des fonctions serveur dans l'onglet Actions.
#
# Pourquoi un workflow pour lire des journaux : ils existent déjà dans la
# console de Google, mais les y trouver demande de choisir la bonne console
# — Firebase ou Cloud —, la bonne fenêtre de temps, le bon filtre, puis de
# recopier ce qu'on y voit. Trois tentatives ont échoué sur une fenêtre réglée
# à cinq minutes alors que l'essai datait d'un quart d'heure, et sur une requête
# qui ne montrait rien.
#
# Ici, un bouton. Les lignes s'affichent dans le journal d'exécution, qui se
# copie d'un bloc.
#
# Rien n'est déployé, rien n'est modifié : c'est une lecture.
#
# Secret attendu, le même que pour le déploiement :
#
#   FIREBASE_SERVICE_ACCOUNT   la clé d'un compte de service du projet, en JSON

on:
  workflow_dispatch:
    inputs:
      fonction:
        description: "Fonction à lire. Vide = toutes."
        required: false
        default: verifierAchat
        type: string
      lignes:
        description: "Nombre de lignes à remonter."
        required: false
        default: "50"
        type: string
      heures:
        description: "Remonter jusqu'à combien d'heures en arrière."
        required: false
        default: "6"
        type: string

permissions:
  contents: read

env:
  PROJET: rapidmusic-db075

jobs:
  journaux:
    runs-on: ubuntu-latest
    steps:
      - name: Lire les journaux
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FONCTION: ${{ inputs.fonction }}
          LIGNES: ${{ inputs.lignes }}
          HEURES: ${{ inputs.heures }}
        run: |
          set -euo pipefail

          if [ -z "$CLE" ]; then
            echo "::error::Le secret FIREBASE_SERVICE_ACCOUNT est absent. Voir docs/courriels.md."
            exit 1
          fi

          # Hors du dépôt, et désignée par la variable que firebase-tools
          # attend : la passer en ligne de commande l'exposerait dans la liste
          # des processus.
          CHEMIN="$RUNNER_TEMP/cle-service.json"
          printf '%s' "$CLE" > "$CHEMIN"
          export GOOGLE_APPLICATION_CREDENTIALS="$CHEMIN"

          # `gcloud` plutôt que `firebase functions:log`, et c'est une leçon
          # payée : ce dernier rendait obstinément les mêmes entrées vieilles
          # d'un jour, noyées dans les journaux d'audit des déploiements, et
          # ignorait l'essai fait trois minutes plus tôt. On a cru deux fois
          # qu'une fonction n'avait pas tourné alors qu'elle venait de le faire.
          #
          # Ici, la fenêtre de temps est explicite et les journaux d'audit sont
          # écartés par le `logName` : il ne reste que ce que la fonction a
          # elle-même écrit.
          gcloud auth activate-service-account --key-file="$CHEMIN" --quiet
          gcloud config set project "$PROJET" --quiet

          FILTRE='resource.type="cloud_function" AND logName:"cloud-functions"'
          if [ -n "$FONCTION" ]; then
            FILTRE="$FILTRE AND resource.labels.function_name=\"$FONCTION\""
          fi

          # `--order=desc`, et c'est le cœur du sujet : avec un tri croissant,
          # `--limit` rend les entrées les plus **anciennes** de la fenêtre, pas
          # les dernières. Le journal semblait alors s'arrêter toujours au même
          # endroit, quelle que soit la fenêtre demandée — on a cru deux fois
          # qu'aucun essai récent n'avait eu lieu alors qu'il venait d'avoir
          # lieu. Les plus récentes sont donc en tête.
          echo "Journaux de ${FONCTION:-toutes les fonctions} — $LIGNES lignes, $HEURES dernières heures."
          echo "LES PLUS RÉCENTES EN PREMIER."
          echo "============================================================"
          gcloud logging read "$FILTRE" \
            --freshness="${HEURES}h" \
            --limit="$LIGNES" \
            --order=desc \
            --format='value(timestamp.date("%Y-%m-%d %H:%M:%S"), severity, jsonPayload.message, textPayload)' \
            || {
              echo "::error::Lecture refusée. Le compte de service a-t-il le rôle « Lecteur de journaux » (roles/logging.viewer) ?"
              exit 1
            }
          echo "============================================================"
          echo "Fin. Aucune ligne au-dessus = la fonction n'a pas tourné sur la période."
