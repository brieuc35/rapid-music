name: Application Android (.aab)

# Fabrique l'enveloppe Android du site — une « Trusted Web Activity », qui
# affiche rapidmusic.fr en plein écran sans barre d'adresse.
#
# Pourquoi ici et pas sur un poste de travail : la fabrication réclame le SDK
# Android, environ un gigaoctet, déjà installé sur les serveurs de GitHub.
#
# Deux modes, selon que les secrets de signature existent ou non :
#
#   sans secret  → paquet NON signé. Il ne peut pas être envoyé au Play Store,
#                  mais il prouve que la fabrication aboutit et que la
#                  configuration est juste.
#   avec secrets → paquet signé, prêt à être envoyé.
#
# Secrets attendus, à créer dans Réglages → Secrets and variables → Actions :
#   ANDROID_KEYSTORE_BASE64   le magasin de clés, encodé en base64
#   ANDROID_KEYSTORE_PASSWORD son mot de passe
#   ANDROID_KEY_PASSWORD      le mot de passe de la clé
#   ANDROID_KEY_ALIAS         le nom de la clé dans le magasin

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version affichée (ex. 1.0.0). Vide = celle du fichier."
        required: false
        type: string
      versionCode:
        description: "Code de version, entier. Doit dépasser tout envoi précédent. Vide = numéro d'exécution."
        required: false
        type: string
  # Sur modification de la configuration : une erreur y est autrement invisible
  # jusqu'au jour où l'on veut publier.
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Bubblewrap réclame un JDK 17, pas celui du serveur par défaut.
      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      # Sans ces deux chemins, Bubblewrap propose de télécharger son propre JDK
      # et attend une réponse — ce qui bloquerait l'exécution indéfiniment.
      - name: Désigner le JDK et le SDK Android
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "SDK Android introuvable sur ce serveur." >&2
            exit 1
          fi
          echo "JDK : $JAVA_HOME"
          echo "SDK : $SDK"
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$SDK"
          bubblewrap doctor

      - name: Fixer la version
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs'
            const f = 'android/twa-manifest.json'
            const m = JSON.parse(readFileSync(f, 'utf8'))
            m.appVersionCode = Number(process.env.CODE)
            if (process.env.NAME) m.appVersionName = process.env.NAME
            if (!Number.isInteger(m.appVersionCode) || m.appVersionCode < 1) {
              throw new Error('Code de version invalide : ' + process.env.CODE)
            }
            writeFileSync(f, JSON.stringify(m, null, 2) + '\n')
            console.log('Version ' + m.appVersionName + ' (code ' + m.appVersionCode + ')')
          "
        env:
          CODE: ${{ inputs.versionCode || github.run_number }}
          NAME: ${{ inputs.versionName }}

      - name: Récupérer la clé de signature
        id: cle
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "signe=oui" >> "$GITHUB_OUTPUT"
            echo "Clé de signature trouvée : le paquet sera signé."
          else
            echo "signe=non" >> "$GITHUB_OUTPUT"
            echo "Aucune clé de signature : le paquet ne sera pas signé."
          fi

      # Génère le projet Android à partir de android/twa-manifest.json. Sans
      # « --skipVersionUpgrade », Bubblewrap demanderait un numéro de version.
      - name: Générer le projet Android
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Fabriquer le paquet
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.cle.outputs.signe }}" = "oui" ]; then
            bubblewrap build \
              --signingKeyPath="$RUNNER_TEMP/upload.keystore" \
              --signingKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            bubblewrap build --skipSigning
          fi

      - name: Rassembler ce qui a été produit
        id: sortie
        working-directory: android
        run: |
          mkdir -p ../paquet
          # Signé : à la racine du projet. Non signé : sous app/build/outputs.
          for f in app-release-bundle.aab \
                   app/build/outputs/bundle/release/app-release.aab \
                   app-release-signed.apk \
                   app-release-unsigned-aligned.apk; do
            [ -f "$f" ] && cp "$f" ../paquet/
          done
          if [ -z "$(ls -A ../paquet)" ]; then
            echo "Aucun paquet produit." >&2
            exit 1
          fi
          ls -lh ../paquet
          # Le .aab est le seul fichier que le Play Store accepte.
          ls ../paquet | grep -q '\.aab$' || { echo "Pas de .aab produit." >&2; exit 1; }

      - name: Déposer le paquet
        uses: actions/upload-artifact@v4
        with:
          name: rapidmusic-android-${{ steps.cle.outputs.signe == 'oui' && 'signe' || 'non-signe' }}
          path: paquet/
          if-no-files-found: error
          retention-days: 30

      - name: Empreinte de la clé, pour assetlinks.json
        if: steps.cle.outputs.signe == 'oui'
        run: |
          # Utile pour vérifier un paquet installé à la main. L'empreinte à
          # publier reste celle de la clé avec laquelle Google resigne
          # l'application, lisible dans la Play Console.
          keytool -list -v \
            -keystore "$RUNNER_TEMP/upload.keystore" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            | grep -A1 'SHA256:' || true
