<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- Même dessin que la marque : note traversée d'un éclair.

       La note est fine, l'éclair est gras — et c'est à 16 px que cet écart
       compte le plus : à épaisseurs égales, les deux se confondaient en une
       tache. L'éclair est plein, puis dilaté par un contour de sa propre
       couleur, avec des angles en `miter` pour garder ses pointes.

       Recopié de scripts/marque.mjs, qu'un fichier statique ne peut pas
       importer. Le cadrage est ajusté à la mesure de l'encre peinte. -->
  <g transform="translate(13.20 14.27) scale(1.576)" fill="none" stroke="#fff"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 16.5V5l8-1.5" stroke-width="1.8"/>
    <circle cx="6" cy="16.5" r="2.6" stroke-width="1.8"/>
    <path d="M18.4 6.2 13.6 12.9h3.6L14.4 19.8 20.8 11.4h-3.8z"
          fill="#fff" stroke="#fff" stroke-width="0.6" stroke-linejoin="miter"/>
  </g>
</svg>
