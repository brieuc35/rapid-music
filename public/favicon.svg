<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- Même dessin que la marque : note traversée d'un éclair.

       L'éclair est plein — c'est à 16 px que ça se voit le plus : au trait, ses
       branches se rejoignaient et il ne restait qu'une tache.

       Recopié de scripts/marque.mjs, qu'un fichier statique ne peut pas
       importer. Traits de la note légèrement épaissis pour tenir à 16 px. -->
  <g transform="translate(13.72 13.93) scale(1.609)" fill="none" stroke="#fff"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 16.5V5l8-1.5" stroke-width="2.3"/>
    <circle cx="6" cy="16.5" r="2.6" stroke-width="2.3"/>
    <path d="M18.4 6.2 13.6 12.9h3.6L14.4 19.8 20.8 11.4h-3.8z" fill="#fff" stroke="none"/>
  </g>
</svg>
