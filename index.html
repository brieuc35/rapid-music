<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- iOS ignore le manifeste pour l'icône de l'écran d'accueil : il lui faut
         ce lien, et une image sans transparence, qu'il arrondit lui-même. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- La couleur de la barre d'état du téléphone. Celle de la barre de
         navigation de l'application (`--nav-bg`), pour qu'elles se confondent. -->
    <meta name="theme-color" content="#14101f" />
    <!-- Lancement en plein écran depuis l'écran d'accueil d'un iPhone, le
         manifeste ne suffisant pas là non plus. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RapidMusic" />
    <meta
      name="description"
      content="RapidMusic — le gestionnaire de carrière tout-en-un pour les artistes : contrats, concerts, sorties, royalties, studio, contacts et label."
    />
    <title>RapidMusic</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
