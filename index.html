<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- iOS ignore le manifeste pour l'icône de l'écran d'accueil : il lui faut
         ce lien, et une image sans transparence, qu'il arrondit lui-même. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- La couleur de la barre d'état du téléphone. Celle de la barre de
         navigation de l'application (`--nav-bg`), pour qu'elles se confondent. -->
    <meta name="theme-color" content="#14101f" />
    <!-- Lancement en plein écran depuis l'écran d'accueil d'un iPhone, le
         manifeste ne suffisant pas là non plus. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RapidMusic" />
    <meta
      name="description"
      content="RapidMusic — le gestionnaire de carrière tout-en-un pour les artistes : contrats, concerts, sorties, royalties, studio, contacts et label."
    />
    <title>RapidMusic</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /*  Le même repli que public/404.html, mais côté application.
       *
       *  Les deux sont nécessaires, et ne se recouvrent pas : GitHub Pages sert
       *  404.html à la première visite, mais une fois le service worker installé
       *  c'est LUI qui répond aux adresses inconnues, avec index.html
       *  (`navigateFallback` dans vite.config.ts). 404.html n'est alors jamais
       *  atteint, et sans ce second garde-fou l'application démarrerait sur son
       *  écran d'accueil en perdant le lien demandé.
       *
       *  Placé avant le chargement de l'application : il n'y a rien à défaire si
       *  la redirection a lieu.
       */
      ;(function () {
        var chemin = location.pathname
        if (chemin !== '/' && chemin !== '/index.html' && !location.hash) {
          location.replace('/#' + chemin + location.search)
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
